[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "secrety"
dynamic = ["version"]
description = "Scan source code and Git history for exposed secrets, with a confidence score."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nakken13" }]
requires-python = ">=3.11"
keywords = ["security", "secrets", "secret-scanning", "git", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
secrety = "secrety.cli:app"

[project.urls]
Homepage = "https://github.com/Nakken13/secrety"
Issues = "https://github.com/Nakken13/secrety/issues"

[tool.hatch.version]
path = "src/secrety/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secrety"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=secrety --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["secrety"]
