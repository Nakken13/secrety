# Default detection rules for secrety.
#
# Each rule: id, description, regex (Python `re` syntax), and optionally
#   secret_group  capture group holding the secret (0 = whole match)
#   confidence    prior probability that a match is a real secret, in [0, 1]
#   keywords      lowercase substrings used as a cheap pre-filter
#
# Confidence reflects how specific the format is: a fixed vendor prefix with a
# fixed length (AWS, GitHub) is rarely anything but a key, while a generic
# "password = ..." assignment is often a placeholder.
#
# Security: the scanner reads untrusted input (any repository), so every
# quantifier is bounded and patterns avoid starting a match in the middle of a
# run of the same characters. Unbounded `x+` / `{n,}` let a crafted line
# trigger quadratic backtracking (ReDoS); tests/test_regex_detector.py keeps
# worst-case lines as regression tests.
#
# To extend: copy this file, add rules, and pass it with `--rules`.

version: 1
rules:
  - id: aws-access-key-id
    description: AWS access key ID
    regex: '\b((?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'
    secret_group: 1
    confidence: 0.9
    keywords: [akia, asia, abia, acca]

  - id: aws-secret-access-key
    description: AWS secret access key (assigned to an aws_secret* variable)
    regex: '(?i)aws_?secret_?(?:access_?)?key\b["'']?\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    secret_group: 1
    confidence: 0.9
    keywords: [aws]

  - id: github-token
    description: GitHub token (personal, OAuth, user-to-server, server-to-server, refresh)
    regex: '\b(gh[pousr]_[A-Za-z0-9]{36})\b'
    secret_group: 1
    confidence: 0.95
    keywords: [ghp_, gho_, ghu_, ghs_, ghr_]

  - id: github-fine-grained-pat
    description: GitHub fine-grained personal access token
    regex: '\b(github_pat_[A-Za-z0-9_]{82})\b'
    secret_group: 1
    confidence: 0.95
    keywords: [github_pat_]

  - id: stripe-secret-key
    description: Stripe secret or restricted API key
    regex: '\b((?:sk|rk)_(?:live|test)_[A-Za-z0-9]{24,99})\b'
    secret_group: 1
    confidence: 0.9
    keywords: [sk_live_, sk_test_, rk_live_, rk_test_]

  - id: slack-token
    description: Slack bot, user, app or refresh token
    regex: '\b(xox[baprs]-[A-Za-z0-9-]{10,256})\b'
    secret_group: 1
    confidence: 0.85
    keywords: [xoxb-, xoxa-, xoxp-, xoxr-, xoxs-]

  - id: slack-webhook
    description: Slack incoming webhook URL
    regex: '(https://hooks\.slack\.com/services/T[A-Za-z0-9_]+/B[A-Za-z0-9_]+/[A-Za-z0-9]{24})'
    secret_group: 1
    confidence: 0.9
    keywords: [hooks.slack.com]

  - id: google-api-key
    description: Google API key
    regex: '\b(AIza[0-9A-Za-z_\-]{35})(?![0-9A-Za-z_\-])'
    secret_group: 1
    confidence: 0.85
    keywords: [aiza]

  - id: jwt
    description: JSON Web Token
    regex: '(?<![A-Za-z0-9_-])(eyJ[A-Za-z0-9_-]{10,4096}\.eyJ[A-Za-z0-9_-]{10,4096}\.[A-Za-z0-9_-]{10,4096})'
    secret_group: 1
    confidence: 0.6
    keywords: [eyj]

  - id: private-key
    description: PEM private key block
    regex: '(-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----)'
    secret_group: 1
    confidence: 0.95
    keywords: [private key]

  - id: url-credentials
    description: Password embedded in a URL (scheme://user:password@host)
    regex: '(?<![a-zA-Z0-9+.\-])[a-zA-Z][a-zA-Z0-9+.\-]{0,31}://[^\s:/@''"]{1,256}:([^\s@/''"$<{%][^\s@/''"]{0,255})@[^\s''"/]{1,256}'
    secret_group: 1
    confidence: 0.75
    keywords: ['://']

  - id: generic-password-assignment
    description: Hard-coded password, secret or token assigned to a variable
    regex: '(?i)\b(?:password|passwd|pwd|secret|api_?key|access_?token|auth_?token)\b["'']?\s*[:=]\s*["'']([^"''\s$<{%][^"''\s]{7,255})["'']'
    secret_group: 1
    confidence: 0.4
    keywords: [password, passwd, pwd, secret, apikey, api_key, token]
